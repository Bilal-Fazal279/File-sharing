<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="hud-container">
    <div class="header">
      <div class="brand">
        <span class="pulse-dot"></span> <h1>Work Order Verification</h1>      </div>
      <div class="system-state">
        <span class="active-tag">ACTIVE</span>
      </div>
    </div>



    <div class="glass-card summary-card">
      <div class="stat-row">
        <span class="label">TASK COMPLETION</span>
        <span class="value cyan-text">0.00%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill cyan-glow" style="width: 0%"></div>
      </div>
    </div>

    <div class="section-divider">VERIFICATION STACK</div>

    <div id="results">
      <div class="item-card">
        <div class="icon-box cyan-border">
          <div class="mini-icon" style="font-size: 18px; display: flex; align-items: center; justify-content: center;">
        📭
      </div>
        </div>
        <div class="item-info">
          <span class="item-label cyan-text">NOTHING TO SHOW</span>
          <span class="item-value">EMPTY</span>
        </div>
        <div class="status-icon yellow-text">...</div>
      </div>

    </div>

    <button id="check" class="main-button">
      CHECK WORK ORDER <span class="arrow">»</span>
    </button>


  </div>

  <script src="popup.js"></script>
</body>

</html>
