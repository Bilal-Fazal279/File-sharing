<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work Order Checker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 10px; width: 300px; }
    h2 { text-align: center; }
    ul { list-style: none; padding-left: 0; }
    li { margin: 5px 0; font-size: 14px; }
    .success { color: green; }
    .error { color: red; }
    button { width: 100%; padding: 10px; margin-top: 10px; font-size: 14px; }
    #spinner {
      display: none;
      margin: 10px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
  </style>
</head>
<body>
  <h2>Work Order Checker</h2>
  <div id="spinner"></div>
  <ul id="results"></ul>
  <button id="check" >Check Work Order</button>

  <script src="popup.js"></script>
</body>
</html>
